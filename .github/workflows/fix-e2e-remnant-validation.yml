name: Fix E2E Remnant Validation

on:
  push:
    branches:
      - agent/factory-order-architecture

permissions:
  contents: write

jobs:
  fix-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/factory-order-architecture
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Correct remnant material lookup
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("wood_factory/e2e.py")
          text = path.read_text(encoding="utf-8")

          old = '\tpiece_item = frappe.db.get_value("Factory Piece", values.replacement_piece, "board_item")'
          new = '''\tpiece_cutting_order = frappe.db.get_value(
          \t\t"Factory Piece", values.replacement_piece, "cutting_order"
          \t)
          \tpiece_item = frappe.db.get_value("Cutting Order", piece_cutting_order, "board_item")'''

          if old not in text:
              raise SystemExit("Expected Factory Piece board_item lookup was not found")

          text = text.replace(old, new, 1)
          text = text.replace("limit_page_length=0", "limit=0")
          path.write_text(text, encoding="utf-8")
          PY
      - name: Format and validate focused file
        run: |
          python -m pip install ruff==0.14.10
          ruff check --fix wood_factory/e2e.py
          ruff format wood_factory/e2e.py
          python -m py_compile wood_factory/e2e.py
      - name: Commit correction
        run: |
          if git diff --quiet -- wood_factory/e2e.py; then
            echo "E2E remnant validation is already corrected"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wood_factory/e2e.py
          git commit -m "Fix E2E remnant material validation"
          git push origin HEAD:agent/factory-order-architecture
