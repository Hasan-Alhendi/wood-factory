name: Factory E2E Autofix

on:
  push:
    branches:
      - agent/factory-order-architecture

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/factory-order-architecture
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install ruff==0.14.10
      - name: Format focused E2E files
        run: |
          ruff check --fix wood_factory/e2e.py wood_factory/tests/test_e2e_factory_flow.py
          ruff format wood_factory/e2e.py wood_factory/tests/test_e2e_factory_flow.py
      - name: Commit focused formatting
        run: |
          if git diff --quiet -- wood_factory/e2e.py wood_factory/tests/test_e2e_factory_flow.py; then
            echo "Factory E2E files already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wood_factory/e2e.py wood_factory/tests/test_e2e_factory_flow.py
          git commit -m "Format factory end-to-end acceptance modules"
          git push origin HEAD:agent/factory-order-architecture
